name: merge-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install semgrep
      - run: npm run lint
      - run: npm run scan
      - run: npm test
      - run: npm run build
