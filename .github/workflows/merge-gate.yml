name: merge-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint:static
      - run: npm run lint:boundaries

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:backend
      - run: npm run test:services

  web:
    name: web
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npm run e2e

  review-policy:
    name: review policy reminder
    runs-on: ubuntu-latest
    needs: web
    steps:
      - run: |
          echo "Run Codex first-pass review with .agents/skills/first-pass-review/SKILL.md."
          echo "Humans remain final gate for customer-facing UI, public API, security, data-loss, and design-sensitive work."
