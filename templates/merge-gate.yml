name: merge-gate

on:
  pull_request:
    branches: [main]

jobs:
  deterministic-gate:
    name: deterministic gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run gate

  codex-review-policy:
    name: codex review policy
    runs-on: ubuntu-latest
    needs: deterministic-gate
    steps:
      - uses: actions/checkout@v4
      - name: Review policy
        run: |
          echo "Invoke Codex PR review with .agents/skills/first-pass-review/SKILL.md as policy."
          echo "Keep humans as the final gate for customer-facing, public API, security, and data-loss changes."
