rules:
  - id: no-raw-fetch-outside-api-client
    message: "Frontend code must use src/api/client.ts instead of raw fetch."
    severity: ERROR
    languages: [typescript, javascript]
    pattern: fetch(...)
    paths:
      include:
        - "src/**/*.ts"
        - "src/**/*.tsx"
      exclude:
        - "src/api/client.ts"
